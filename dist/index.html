<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .container {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .container h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .container p {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Primary style for User Dashboard */
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    /* Secondary style for SacraDigit Dashboard */
    .btn-secondary {
      background-color: #0f172a;
      color: #ffffff;
    }

    .btn-secondary:hover {
      background-color: #1e293b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>System Portals</h1>
    <p>Select a dashboard below to access your desired module.</p>

    <div class="btn-group">
      <!-- Button 1: User Dashboard -->
      <a href="user/user-dashboard.html" class="btn btn-primary">
        Go to User Dashboard
      </a>

      <!-- Button 2: Sacradigit Dashboard -->
      <a href="Sacradigit/dashboard.html" class="btn btn-secondary">
        Go to SacraDigit Dashboard
      </a>
    </div>
  </div>

</body>
</html>
